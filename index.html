    <script>
      // Gracefully prevent Vite HMR WebSocket errors from bubbling in sandbox iframe environment
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket') || event.filename?.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
